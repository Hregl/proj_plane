%YAML:1.0
# ============================================================================
#  config/system.yaml  —— 系统级配置（IF-FILE-01）
#
#  依据：ENG-01 §3.2（7 个运行配置文件之一）、SYS-04 §6.5（IF-FILE-01）
#        ENG-10 §5.3（文件缺失 → 启动失败；字段缺失 → 默认值 + 记录；
#                    取值越界 → 启动失败）
#        ENG-02 §15（ConfigManager 是第一个被创建的对象 —— 因为 log_dir
#                    与 log_level 只有读到这里才知道，Logger 依赖它）
#
#  ⚠ 书写约定（OpenCV cv::FileStorage 的 YAML 子集）：
#    0. **`%YAML:1.0` 必须留在文件第一行**（本次已把它上移到此处）：
#       该指令之前不能有任何注释或空行，否则 OpenCV 抛
#       "Input file is invalid" 且不给行号，极难定位。
#       往文件头加注释时，请加在 `%YAML:1.0` 的**下面**。
#    1. ns 级时长一律用**科学计数法**（如 6.0e10 = 60 s）。
#       朴素整数 60000000000 会被 32 位整数节点截断为 -129542144 且不报错
#       （ConfigManager 已对此加负值拦截，但正确写法是从源头避免）。
#    2. 路径分隔符用 '/'；相对路径相对**进程当前目录**。
#       现场部署建议写绝对路径（如 /opt/aps/logs），因为从不同目录启动
#       会让日志落到不同地方，排障时先要花时间找文件。
#    3. 字符串加引号（"virtual" / "sdk"）。
# ============================================================================

---
system:
   # 日志目录。不存在时由 Logger 递归创建（mkdir -p 语义）。
   log_dir: "logs"
   # 测量结果输出目录。measurement_xxx/ 结果包建在此目录下（SYS-04 §6.4）。
   output_dir: "output"
   # 目标模型与特征库目录（points3d.yaml / feature25|50|100.bin）。
   # 出厂时随交付包提供；缺失不构成启动失败（特征库属于后续交付物），
   # 但会在日志中告警并使测量链路无法完成 POSE_SOLVE。
   model_dir: "models"
   # 日志级别：0=DEBUG 1=INFO 2=WARN 3=ERROR 4=OFF
   # （枚举定义见 infrastructure/logger/Logger.h；SYS-04 §6.5 只规定
   #  "由 SystemConfig::logLevel 控制"，取值含义由该头文件冻结。）
   # 现场运行取 1：INFO 足以覆盖启动、设备状态与状态机迁移；
   # 排障时改 0 可拿到逐帧细节（日志量约增大两个数量级）。
   log_level: 1

%YAML:1.0
# ============================================================================
#  config/camera.yaml  —— 三相机通道配置
#
#  依据：ENG-09 §6.1（CameraConfig 字段与单位）、§2.3（focalLength 单位）
#        SYS-06 §5（三焦段相机）、SYS-04 §6.5（IF-FILE-01）
#
#  ⚠ focal_length 的单位是**米**（ENG-09 §2.3 专门提示）：
#    25 mm 镜头写 0.025，100 mm 镜头写 0.1。
#    写成 25.0 / 100.0 不会有任何编译或运行错误，只会让 SYS-14 §10 的
#    距离估计式 Z = f·L/(l·s) 偏大 1000 倍，进而选错焦段。
#    ConfigManager 对焦距做了量级校验（(0.001, 0.5] m），越界即启动失败。
#
#  ⚠ exposure_time 的单位是**秒**（ENG-09 §6.1 冻结为 s，不是 ms/µs）。
#
#  ⚠ 增益有**两个互斥的键**（C-018，2026-09-28）：
#      gain     —— 单位 **dB**（ENG-09 §6.1）。只对**确实声明了 dB 语义
#                  `Gain` 节点**的设备可用。
#      gain_raw —— 设备的**原生数值**，本项目**不做单位解释**。
#    两者**同时给出即启动失败**（单位不同，同时存在时"实际写了多少增益"
#    没有唯一答案）。都不给也合法：表示本项目**不写**该特性，设备保持
#    其当前值 —— 这与"配 0 dB"是两件事，装配摘要会区分开来。
#    ⚠ **迁移时不得把 dB 数值照抄进 `gain_raw`**："写 6、读回 6"只证明
#      写入成功，**证明不了单位是 dB**。
#
#    本工程当前机型 A7A20MU201（序列号 FD88772AAK00078，固件
#    V1.000.00.0.R(20230529,252473)）实测：**没有 `Gain` 节点**
#    （`IMV_GetDoubleFeatureValue("Gain")` 返回 −110），只有 `GainRaw`
#    （Float，量程 1..32，**未声明单位**：XML 里该节点无 `<Unit>`，
#    "dB" 只出现在 `DeEmphasisA`（以太网预加重，传输层）的枚举说明里，
#    与增益无关）⇒ 本机型只能用 `gain_raw`，且其含义只能按**原生值**理解。
#    标定/换相机时必须重新实测，不得沿用本段的结论。
#
#  ⚠ trigger_mode 是**三值字符串**（ENG-09 V2.3 起；旧版是 1 = 硬触发、
#    0 = 软触发）：`software` / `hardware` / `free_run`。
#    旧数字值**显式拒绝并给迁移提示**，不自动映射 —— 旧 `1` 的语义是
#    "开触发"，而开触发之后还分软件源与硬件源，自动映射到任一边都可能
#    把另一边的意图悄悄改掉（ConfigManager 逐值报错）。
#    本批 CAM25 用 `software`（软触发）；`hardware` 归 PH-01 未实施；
#    `free_run` 真实后端返回 NotImplemented（不静默当自由运行）。
#
#  ⚠ backend 必须**逐通道显式声明** `virtual` 或 `imv`（ENG-09 §6.1）：
#    缺键即配置错误、启动失败。不设默认值，也不因"检测到 SDK"自动切换 ——
#    隐式默认会让一份虚拟配置在 SDK 装好后**静默**变成真实采集。
#
#  ⚠ serial 是**设备标签上的序列号**（期望值，用于按序列号绑定设备）。
#    它在 backend = "virtual" 时留空（虚拟后端没有设备可绑定）；
#    backend = "imv" 时**必须非空**，否则启动失败 —— 三台相机同型号，
#    按型号或"第 0 个设备"打开会在换了线序之后静默接错焦段。
#    现场接入时把对应通道的 backend 改为 "imv" 并填上实际序列号。
#
#  ⚠ 虚拟通道（backend = "virtual"）的 width/height/exposure_time 是
#    **占位值**（与 VirtualCameraBackend 在未配置时的回退尺寸一致，使虚拟
#    图像尺寸稳定，便于比对）。虚拟通道**不写增益键** —— 没有设备可写，
#    写了也只会得到一句"未被下发"；不写才是如实表示"本项目不配置增益"。
#    真实通道的每一项都必须是**实测值**，分辨率尤其重要：它与标定的主点
#    绑定（见 CameraCalibration.h），换了分辨率而不换标定，主点会整体平移
#    而不报错。替换分辨率时须同步更新 calibration/ 下的标定文件。
# ============================================================================

---
cameras:
   -
      # 通道的**逻辑名**（`CameraChannel::cameraId`），与焦段绑定，
      # 由配置决定；设备身份在独立的 serial 键里（ENG-09 §6.1）。
      #
      # ⚠ 旧版此处写的是"真实后端下即相机序列号"，那是错的：逻辑名一旦
      #    被当成序列号，`serial` 键就无处安放，设备身份也就无法与通道
      #    解耦（换一台同型号相机要改 id，而 id 还被预览/落盘/界面引用）。
      id: "cam25"
      # 焦段角色：CAM25 / CAM50 / CAM100（ENG-09 §4.1 冻结的三个取值）
      role: "CAM25"
      # ⚠ 2026-09-28：CAM25 接入实机（A7A20MU201）。
      #    CAM50／CAM100 仍为虚拟 —— 现场只有一台相机，这两路的画幅与
      #    曝光仍是占位值，**不得**据它们判断实机链路已验收。
      backend: "imv"
      serial: "FD88772AAK00078"
      # 实测输出（`IMV_DeviceInfo` 报告并由探针取帧复核）：4096 × 3000。
      # 设备声明的可设范围另有 X/Y 偏移与增量，本批只固定画幅。
      width: 4096
      height: 3000
      # ⚠ 2026-09-28 实测定的值，不是沿用虚拟阶段的占位值。
      #    实测（软件触发、单帧、10 位满量程 1023，帧均值）：
      #      5 ms → 23.6（8 位 5.9）   10 ms → 47.9    20 ms → 96.9
      #     50 ms → 244.2（无饱和，最大 778）  100 ms → 430.3（最大 1023，已有饱和）
      #      200 ms → 521.0（最大 1023，饱和面积扩大）
      #    取 50 ms 的理由：**用满动态范围但不出现饱和像素**。原值 0.005 s
      #    （5 ms）在实机上均值只有满量程的 2.3%，这就是"预览有图但接近全黑"
      #    的原因 —— 而 0.005 是虚拟阶段的占位值，从未按实机重新定过。
      #    饱和会破坏质心/特征提取（灰度直接进算法链），故不取 100 ms。
      # ⚠ 这一档（连同下面的 gain_raw: 1）是**当前验收工作点**，用于跑通
      #    CAM25 实机链路，**不是定档的测量参数**，不得当作最终取值冻结。
      #    它只对**本次标定/光照条件**成立；换目标、换光源、换镜头都要重测。
      #    ⚠ 换工作点必须**实测**：亮度虽近似 ∝ 曝光 × 增益，但降低曝光即减少
      #      收集到的光子，提高增益**补不回**这些信息（噪声、信噪比、运动模糊
      #      都可能变），故**不能由本表或其他档位外推**。链路验收通过后优先
      #      实测对比 25 ms + gain_raw 2（固定光照/目标/其余设置，比较亮度、
      #      饱和像素比例、时间噪声与实际帧间隔），再决定是否切换。
      exposure_time: 0.05
      # ⚠ `gain_raw` 是**设备原生值**，不是 dB。取 1 = 该设备出厂值
      #    （XML 中 `GainRawMin` 的 `<Value>1</Value>`，与量程下限相同）
      #    —— 选它的理由是**本项目不改变设备的增益设定**，只把它如实记下；
      #    不是为了把旧的 `gain: 6.0 dB` 迁过来（那正是禁止的做法）。
      #    ⚠ 2026-09-28 的探针曾向设备写入 6 做过往返验证，故记录里若看到
      #    该设备 GainRaw 的"当前值"为 6，那是探针留下的，不是默认值。
      #    ⚠ 与上面的 exposure_time 一起构成**当前验收工作点**（不是定档值）。
      gain_raw: 1
      trigger_mode: software
      focal_length: 0.025
   -
      id: "cam50"
      role: "CAM50"
      backend: "virtual"
      serial: ""
      width: 1280
      height: 1024
      exposure_time: 0.003
      trigger_mode: software
      focal_length: 0.05
   -
      id: "cam100"
      role: "CAM100"
      backend: "virtual"
      serial: ""
      width: 1280
      height: 1024
      exposure_time: 0.002
      trigger_mode: software
      focal_length: 0.1

%YAML:1.0
# ============================================================================
#  config/trigger.yaml  —— 三相机同步触发配置
#
#  依据：SYS-04 §6.3 / §406（OPEN-HW-02）、§412（OPEN-SW-04）
#        TriggerConfig.h（字段与单位）、ENG-09 §6.4
#
#  ⚠ period_ms 的单位是 **ms**，sync_tolerance_ns 的单位是 **ns**。
#    同一结构体内混用两种时间单位是**有意**的（ENG-09 §6.4 的说明）：
#    周期是人对硬件的设定值，时间戳容差是内核时钟的读数。
#
#  ⚠ sync_tolerance_ns 的取值目前是**占位值**：
#    SYS-04 §406 / §412 把它列为未决项（OPEN-HW-02 / OPEN-SW-04）——
#    它取决于硬触发信号的电平/极性/脉宽/扇出等电气参数，须在拿到
#    硬件规格后重新导出。此处取 1 ms 仅为使同步校验有一个正的可用值。
#    **不得据此认为同步指标已达标。** 已登记待裁决。
#
#  书写：ns 一律科学计数法（见 system.yaml 的书写约定）。
# ============================================================================

---
trigger:
   # 触发源："hardware" | "virtual"
   # 第一阶段用 "virtual"（VirtualTriggerController）——
   # SYS-04 §108 明确：硬触发参数冻结前只能走虚拟触发路径。
   source: "virtual"
   # 触发周期（ms）。取 40 ms → 25 Hz。
   # 取该值的理由：三相机在 25 Hz 下完成 CAPTURE 的 5 帧约需 0.2 s，
   # 远小于 capture_timeout_ns（1.5 s）；再快则合成闭环下无意义地
   # 抬高 CPU 占用（每帧都要做 Qt 转换与缩放绘制）。
   period_ms: 40.0
   # 三相机时间戳允许的最大偏差（ns），判据：
   #   max(timestampNs) − min(timestampNs) <= sync_tolerance_ns
   # 超差时本轮多相机帧不可用于测量（三个视角不是同一时刻的）。
   # 必须用 CLOCK_MONOTONIC 而非墙钟（ENG-09 §2.5）。
   # 1.0e6 = 1 ms，**占位值**，见文件头说明。
   sync_tolerance_ns: 1.0e6
